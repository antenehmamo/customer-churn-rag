plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.example'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

ext {
    cdkVersion = '2.199.0'
    constructsVersion = '10.4.2'
    awsSdkVersion = '2.46.7'
}

dependencies {
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")

    // CDK
    implementation "software.amazon.awscdk:aws-cdk-lib:${cdkVersion}"
    implementation "software.constructs:constructs:${constructsVersion}"

    // Lambda runtime interfaces (for handlers deployed by this stack)
    implementation 'com.amazonaws:aws-lambda-java-core:1.2.3'
    implementation 'com.amazonaws:aws-lambda-java-events:3.11.5'

    // AWS SDK v2 clients used by the Lambda handlers
    implementation 'software.amazon.awssdk:bedrockagentruntime'
    implementation 'software.amazon.awssdk:bedrockagent'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

// CDK app entrypoint (also used by `cdk.json`'s `app` command)
application {
    mainClass = 'com.example.churnrag.ChurnRagApp'
}

// Fat jar used both to run the CDK app and as the deployment artifact for all Lambda handlers.
shadowJar {
    archiveBaseName.set('customer-churn-rag')
    archiveClassifier.set('')
    archiveVersion.set('')
    mergeServiceFiles()
}

test {
    useJUnitPlatform()
}

// Keep stdout quiet except for the CDK CLI's expected cloud-assembly output.
tasks.named('run') {
    standardOutput = System.out
}
